[project]
name = "voiceguard-server"
version = "0.1.1"
description = "Deployable VoiceGuard HTTPS provider and Databricks adapters"
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk>=0.102.0",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.35,<1",
  "voiceguard-core==0.1.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
voiceguard = "voiceguard.api:run"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# This repository is public. Pin public PyPI so CI and local installs do not
# inherit a Databricks-only package proxy from the operator's uv.toml.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
voiceguard-core = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "packages/voiceguard-core/src",
  "packages/voiceguard-client/src",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
